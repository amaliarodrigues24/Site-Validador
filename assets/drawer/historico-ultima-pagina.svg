<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1169 620" width="1169" height="620"
     role="img" aria-label="Exemplo da última página de um histórico escolar com dados fictícios">
  <!-- DOCUMENTO DE EXEMPLO — dados fictícios. -->
  <style>
    .t  { font-family: 'Public Sans','Helvetica Neue',Arial,sans-serif; fill:#2f3136; }
    .h  { font-size:12px; font-weight:700; }
    .c  { font-size:10px; }
    .s  { font-size:9px; fill:#474b52; }
    .code { font-size:12px; font-weight:700; }
  </style>

  <rect width="1169" height="620" fill="#ffffff"/>
  <rect x="1" y="1" width="1167" height="618" fill="none" stroke="#d8dade" stroke-width="1"/>

  <!-- tabela de atividades complementares -->
  <g>
    <rect x="40" y="30" width="1089" height="24" fill="#eef1f6"/>
    <text class="t h" x="52" y="46">Atividades Complementares</text>
    <!-- linhas -->
    <g class="t c" fill="#2f3136">
      <!-- cabeçalho de colunas -->
      <g class="t s">
        <text x="60" y="72">Código</text>
        <text x="260" y="72">Descrição da atividade</text>
        <text x="820" y="72">Carga</text>
        <text x="930" y="72">Início</text>
        <text x="1040" y="72">Fim</text>
      </g>
    </g>
    <!-- 8 linhas de exemplo -->
    <g class="t c">
      <g>
        <line x1="40" y1="82" x2="1129" y2="82" stroke="#e9eaec"/>
        <text x="60" y="98">000000</text>
        <text x="260" y="98">Atividade complementar — curso de extensão / aperfeiçoamento</text>
        <text x="838" y="98">8</text><text x="930" y="98">00/00/0000</text><text x="1040" y="98">00/00/0000</text>
        <line x1="40" y1="110" x2="1129" y2="110" stroke="#e9eaec"/>
        <text x="60" y="126">000000</text>
        <text x="260" y="126">Atividade complementar — curso de extensão / aperfeiçoamento</text>
        <text x="838" y="126">8</text><text x="930" y="126">00/00/0000</text><text x="1040" y="126">00/00/0000</text>
        <line x1="40" y1="138" x2="1129" y2="138" stroke="#e9eaec"/>
        <text x="60" y="154">000000</text>
        <text x="260" y="154">Atividade complementar — curso de extensão / aperfeiçoamento</text>
        <text x="838" y="154">8</text><text x="930" y="154">00/00/0000</text><text x="1040" y="154">00/00/0000</text>
        <line x1="40" y1="166" x2="1129" y2="166" stroke="#e9eaec"/>
        <text x="60" y="182">000000</text>
        <text x="260" y="182">Atividade complementar — curso de extensão / aperfeiçoamento</text>
        <text x="838" y="182">30</text><text x="930" y="182">00/00/0000</text><text x="1040" y="182">00/00/0000</text>
        <line x1="40" y1="194" x2="1129" y2="194" stroke="#e9eaec"/>
        <text x="60" y="210">000000</text>
        <text x="260" y="210">Atividade complementar — curso de extensão / aperfeiçoamento</text>
        <text x="838" y="210">30</text><text x="930" y="210">00/00/0000</text><text x="1040" y="210">00/00/0000</text>
        <line x1="40" y1="222" x2="1129" y2="222" stroke="#e9eaec"/>
        <text x="60" y="238">000000</text>
        <text x="260" y="238">Estágio supervisionado — exemplo</text>
        <text x="834" y="238">400</text><text x="930" y="238">00/00/0000</text><text x="1040" y="238">00/00/0000</text>
      </g>
    </g>
  </g>

  <!-- Participações no ENADE -->
  <g>
    <rect x="40" y="300" width="1089" height="22" fill="#eef1f6"/>
    <text class="t h" x="52" y="315">Participações no ENADE</text>
    <g class="t s">
      <text x="70" y="340">Edição</text>
      <text x="260" y="340">Situação</text>
      <text x="520" y="340">Condição</text>
      <text x="760" y="340">Motivo</text>
    </g>
    <g class="t c">
      <line x1="40" y1="350" x2="1129" y2="350" stroke="#e9eaec"/>
      <text x="70" y="366">0000</text><text x="260" y="366">Não habilitado</text>
      <text x="520" y="366">Ingressante</text><text x="760" y="366">Estudante não habilitado no calendário do ciclo</text>
      <line x1="40" y1="378" x2="1129" y2="378" stroke="#e9eaec"/>
      <text x="70" y="394">0000</text><text x="260" y="394">Não habilitado</text>
      <text x="520" y="394">Concluinte</text><text x="760" y="394">Estudante não habilitado no calendário do ciclo</text>
    </g>
  </g>

  <!-- rodapé: validação + código (canto inferior esquerdo) + QR -->
  <text class="t s" x="40" y="560">Para verificar a autenticidade acesse https://exemplo.com.br/validador e informe o código de validação.</text>
  <text class="t code" x="40" y="582" fill="#2f3136">000.d0000e00ca00</text>
  <text class="t s" x="1129" y="560" text-anchor="end">Página 3 de 3</text>

  <!-- QR decorativo -->
  <g transform="translate(1020,470)">
    <rect width="96" height="96" fill="#ffffff"/>
    <g fill="#2f3136">
      <rect x="8" y="8" width="24" height="24"/><rect x="13" y="13" width="14" height="14" fill="#fff"/><rect x="17" y="17" width="6" height="6"/>
      <rect x="64" y="8" width="24" height="24"/><rect x="69" y="13" width="14" height="14" fill="#fff"/><rect x="73" y="17" width="6" height="6"/>
      <rect x="8" y="64" width="24" height="24"/><rect x="13" y="69" width="14" height="14" fill="#fff"/><rect x="17" y="73" width="6" height="6"/>
      <rect x="40" y="12" width="5" height="5"/><rect x="52" y="20" width="5" height="5"/><rect x="40" y="40" width="5" height="5"/>
      <rect x="52" y="48" width="5" height="5"/><rect x="64" y="44" width="5" height="5"/><rect x="76" y="52" width="5" height="5"/>
      <rect x="40" y="64" width="5" height="5"/><rect x="52" y="72" width="5" height="5"/><rect x="64" y="80" width="5" height="5"/>
      <rect x="76" y="68" width="5" height="5"/><rect x="12" y="40" width="5" height="5"/><rect x="24" y="52" width="5" height="5"/>
    </g>
  </g>
</svg>

  <style>
    .t  { font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif; fill: #2f3136; font-size: 15px; }
    .b  { font-weight: 700; }
  </style>

  <rect width="1168" height="880" fill="#f7f9fc"/>


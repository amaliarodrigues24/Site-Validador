    <tspan x="150" y="382">20/12/1996 e Decreto nº 9.235 de 15/12/2017.</tspan>
  </text>

  <text class="t" x="150" y="492">Cidade Exemplo - UF, 00 de janeiro de 0000.</text>

  <text class="t">
    <tspan x="150" y="558">Nome da Gerente</tspan>
    <tspan x="150" y="576">Gerente de Certificação e Diplomas</tspan>
  </text>


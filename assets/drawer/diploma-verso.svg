    <path d="M0 260 L92 260 L10 405 L0 405 Z" opacity=".75"/>
    <path d="M1168 430 L1058 430 L1140 575 L1168 575 Z"/>
    <path d="M1168 540 L1076 540 L1158 685 L1168 685 Z" opacity=".75"/>
  </g>

  <rect x="32" y="30" width="1104" height="818" fill="none" stroke="#1b3f8f" stroke-width="2"/>

  <text class="t" x="150" y="118">Curso: Superior de Tecnologia em Gastronomia</text>

  <text class="t" x="150" y="182">Reconhecido pela Portaria nº 000 de 00/00/0000 - publicada no D.O.U 000, seção 1, pág. 00 de 00/00/0000</text>

